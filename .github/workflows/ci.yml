name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.18"
  PNPM_VERSION: "10.34.9"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: API + worker (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-postgres
      APP_OWNER_PASSWORD: ci-owner
      APP_RW_PASSWORD: ci-rw
      TEST_DATABASE_URL: postgresql+psycopg://app_rw:ci-rw@localhost:5432/momentsales_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://app_owner:ci-owner@localhost:5432/momentsales_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create database roles (same script as docker compose)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          POSTGRES_USER=postgres PGHOST=localhost sh infra/docker/postgres/10-roles.sh
      - run: uv sync --frozen
      - run: uv run ruff check apps
      - run: uv run ruff format --check apps
      - run: uv run mypy apps/api/src apps/worker/src
      - run: uv run python -m momentsales.tools.export_contracts --check
      - run: uv run pytest --cov --cov-report=term --cov-fail-under=80
      - run: uv run pip-audit --progress-spinner off --skip-editable

  web:
    name: Web + shared (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @momentsales/web build
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: End-to-end (docker compose + Playwright + axe)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @momentsales/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            compose.log

  security:
    name: Secrets and image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -f infra/docker/api.Dockerfile -t momentsales-api:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: momentsales-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
