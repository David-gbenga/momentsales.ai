[project]
name = "momentsales-worker"
version = "0.1.0"
description = "momentsales.ai background workers (Celery)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery>=5.7.0",
    "momentsales-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentsales_worker"]

[tool.uv.sources]
momentsales-api = { workspace = true }
