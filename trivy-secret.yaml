# Trivy secret-scan allow list. Keep every entry narrow and explain it.
allow-rules:
  # The anthropic SDK's beta "managed agents" docstrings contain the literal
  # `{"type": "service_account"}`, which matches Trivy's gcp-service-account rule.
  # It is third-party library text, not a credential. Scoped to those SDK files only.
  - id: anthropic-sdk-beta-docstrings
    description: anthropic SDK docstrings mentioning a service_account execution identity
    path: '/opt/venv/lib/python3\.12/site-packages/anthropic/(types|resources)/beta/'
