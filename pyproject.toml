# uv workspace root (virtual: no package of its own). See docs/adr/0001-monorepo-tooling.md
[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "moto>=5.2.5",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "time-machine>=3.6.0",
    "types-boto3[s3,textract]>=1.43.126",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/worker/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH", "N", "C4", "DTZ"]
ignore = ["S101", "N818"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
"apps/api/migrations/**" = ["E501", "S608"]  # DDL built from constant table names
"apps/api/src/momentsales/modules/exports/service.py" = ["E501"]  # HTML template for the PDF

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api/src", "apps/worker/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celery.*", "pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["apps/api/tests", "apps/worker/tests"]
addopts = "-ra --strict-markers"
markers = ["db: needs Postgres and Redis (docker compose)"]

[tool.coverage.run]
source = ["apps/api/src/momentsales"]
concurrency = ["greenlet", "thread"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true

[[tool.mypy.overrides]]
module = ["momentsales_worker.*"]
disallow_untyped_decorators = false
